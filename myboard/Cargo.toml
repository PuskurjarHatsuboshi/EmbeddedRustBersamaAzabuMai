[package]
name = "myboard"
version = "0.2.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.6"
cortex-m-rt = "0.7.6"
cyw43 = "0.7.0"
cyw43-firmware = { version = "0.1.0", features = ["wifi"] }
cyw43-pio = "0.10.0"
ds323x = "0.7.0"
eg-seven-segment = "0.2.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "icmp", "medium-ethernet", "multicast", "proto-ipv4", "proto-ipv6", "tcp", "udp"] }
embassy-rp = { version = "0.10.0",  features = ["rp2040",  "time-driver", "critical-section-impl", "executor-thread", "executor-interrupt"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = "0.8.2"
embedded-io-async = "0.7.0"
heapless = "0.9.3"
mipidsi = "0.10.0"
nanofish = { version = "0.13.0", features = ["embassy"] }
panic-halt = "0.2.0"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
static_cell = "2.1.1"
tinybmp = "0.7.0"
